[project]
name = "tradrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sandeep", email = "shekhawatsandeepsingh80@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.2",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
tradrag = "tradrag:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
